name: Alerte Crous
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        default: "false"
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python alerte_crous_cloud.py
        env:
          NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
          TEST: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
